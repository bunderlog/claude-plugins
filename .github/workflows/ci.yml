name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: mise run check

  # run.py on a python3 older than 3.9 says so rather than failing on newer syntax (ADR binary):
  # exit 2 for a command, 0 for a Git hook, and nothing for a Hook.
  old-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          docker run --rm -v "$PWD":/w -w /w python:3.6-slim sh -euc '
            r=plugins/baloo/scripts/run.py
            out=$(python -E -s $r version 2>&1) && code=0 || code=$?
            [ "$code" = 2 ] && case $out in "baloo: needs python3 3.9 or later"*) ;; *) false ;; esac ||
              { echo "version: exit $code: $out" >&2; exit 1; }
            python -E -s $r git-hook pre-commit 2>/dev/null
            [ -z "$(echo "{}" | python -E -s $r post-tool-use 2>&1)" ]
          '

  # The README's CI recipe, with the checked commit's plugin in place of a Release's.
  git-hook-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -e
          if [ -n "$PR_BASE" ]; then BASE=$(git merge-base "$PR_BASE" HEAD); else BASE=$PUSH_BASE; fi
          dir=$(mktemp -d)
          baloo() { python3 -E -s "$GITHUB_WORKSPACE/plugins/baloo/scripts/run.py" "$@"; }
          for sha in $(git rev-list "$BASE"..HEAD); do
            git log -1 --format=%B "$sha" > "$dir/msg"
            baloo check conventional-commits "$dir/msg"
            baloo check no-ai-coauthor "$dir/msg"
          done
          echo "refs/heads/ci $(git rev-parse HEAD) refs/heads/$BRANCH $BASE" | baloo check linear-history
          git reset -q --soft "$BASE"
          baloo check no-secrets-in-commits
          baloo check no-conflict-markers
          baloo check no-large-files
