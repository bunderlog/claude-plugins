name: CI

on:
  push:
    branches: [main]
    paths:
      # A commit to the project's knowledge or this repo's own Markdown needs no tests, but for the
      # ADR a test reads; src/release/release.py reads these lists for its check before a Release.
      - '**'
      - '!.about/**'
      - '!*.md'
      - '.about/adr/guidelines.md'
  pull_request:
    paths:
      - '**'
      - '!.about/**'
      - '!*.md'
      - '.about/adr/guidelines.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A Release's own commit changes only versions and the CHANGELOG, on code CI has just passed.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: mise run check

  # run.py on a python3 older than 3.9 says so rather than failing on newer syntax (ADR binary):
  # exit 2 for a command, and nothing for a Hook.
  old-python:
    # A Release's own commit changes only versions and the CHANGELOG, on code CI has just passed.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          docker run --rm -v "$PWD":/w -w /w python:3.6-slim sh -euc '
            for p in bagheera louie; do
              r=plugins/$p/scripts/run.py
              out=$(python -E -s $r version 2>&1) && code=0 || code=$?
              [ "$code" = 2 ] && case $out in "$p: needs python3 3.9 or later"*) ;; *) false ;; esac ||
                { echo "$p version: exit $code: $out" >&2; exit 1; }
              [ -z "$(echo "{}" | python -E -s $r post-tool-use 2>&1)" ]
            done
          '
