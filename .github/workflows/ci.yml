name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: mise run check

  # run.py on a python3 older than 3.9 says so rather than failing on newer syntax (ADR binary):
  # exit 2 for a command, and nothing for a Hook.
  old-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          docker run --rm -v "$PWD":/w -w /w python:3.6-slim sh -euc '
            for p in bagheera louie; do
              r=plugins/$p/scripts/run.py
              out=$(python -E -s $r version 2>&1) && code=0 || code=$?
              [ "$code" = 2 ] && case $out in "$p: needs python3 3.9 or later"*) ;; *) false ;; esac ||
                { echo "$p version: exit $code: $out" >&2; exit 1; }
              [ -z "$(echo "{}" | python -E -s $r post-tool-use 2>&1)" ]
            done
          '

  # louie's go-vue template, written as /louie:new writes it: the line it gives the person turns the
  # Git hooks on and makes the first commit through them, and the fresh repo's check passes (PRD
  # templates).
  template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - shell: bash
        run: |
          set -euo pipefail
          git config --global user.name ci
          git config --global user.email ci@example.com
          line=$(python3 -E -s plugins/louie/scripts/run.py new "$RUNNER_TEMP/demo" demo bunderlog | tail -n 1)
          case $line in "! "*) ;; *) echo "not the line to run: $line" >&2; exit 1 ;; esac
          bash -euc "${line#! }"
          cd "$RUNNER_TEMP/demo"
          test "$(git config core.hooksPath)" = .githooks
          if git commit -q --allow-empty -m wip; then echo "the Git hooks let wip through" >&2; exit 1; fi
          version=$(python3 -E -s "$GITHUB_WORKSPACE/plugins/louie/scripts/run.py" version)
          test "$(git log -1 --format=%s)" = "chore: scaffold from louie go-vue $version"
          mise run check
          if grep -rE '__(NAME|OWNER|DATE)__' --exclude-dir=.git .; then exit 1; fi
          grep -qx 'module github.com/bunderlog/demo' apps/api/go.mod
          # check fails where internal/db isn't what sqlc generates, with no database.
          echo '// drift' >> apps/api/internal/db/models.go
          if mise run check; then echo "check passed with internal/db drifted" >&2; exit 1; fi
          git checkout -- apps/api/internal/db/models.go

  # hathi's commit and repo Checks on what the push or pull request brings.
  hathi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: github:bunderlog/hathi
      - run: hathi check ci
