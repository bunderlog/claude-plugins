name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: mise run check
      # Every platform builds from one OS, as the Release workflow builds them.
      - if: runner.os == 'Linux'
        run: mise run build

  # The README's CI recipe, with the binary built from the checked commit in place of a Release's.
  git-hook-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -e
          if [ -n "$PR_BASE" ]; then BASE=$(git merge-base "$PR_BASE" HEAD); else BASE=$PUSH_BASE; fi
          dir=$(mktemp -d)
          baloo=$dir/baloo
          go -C src/baloo build -o "$baloo" ./cmd/baloo
          for sha in $(git rev-list "$BASE"..HEAD); do
            git log -1 --format=%B "$sha" > "$dir/msg"
            "$baloo" check conventional-commits "$dir/msg"
            "$baloo" check no-ai-coauthor "$dir/msg"
          done
          echo "refs/heads/ci $(git rev-parse HEAD) refs/heads/$BRANCH $BASE" | "$baloo" check linear-history
          git reset -q --soft "$BASE"
          "$baloo" check no-secrets-in-commits
          "$baloo" check no-conflict-markers
          "$baloo" check no-large-files
