# yaml-language-server: $schema=https://raw.githubusercontent.com/bunderlog/claude-plugins/main/plugins/baloo/schema.json
#
# baloo's settings for this repo. Each check and each guideline turns on with a key of its own
# here, and without it is off. A wrong setting is reported at session start, and its default
# applies.

# The Output style for Claude's replies, picked at session start in the settings file that
# enables the plugin, where no settings file of Claude Code's picks one; false picks none.
output-style: short-replies

# The plugin's Status line, set at session start in .claude/settings.local.json, where no
# settings file of Claude Code's but the user's own sets one; false takes it out.
status-line: true

# The Session review: when a session ends, a separate Claude session records in .about/glossary.md
# and .about/adr/ what the conversation settled but nobody wrote down; the next session start
# says what it changed. It never commits.
session-review: true

# Guidelines, the plugin's working rules, which Claude reads when a task calls for one; each
# one on is named to Claude at session start. A stack's is on where the repo had that stack
# when this file was made.
guidelines:
  principles: true
  design: true
  testing: true
  debugging: true
  writing-for-agents: true
  go: true
  typescript: false
  vue: false

# Checks, each on with true and off with false. Those on Claude's tool calls deny, or ask you
# about, a command that would destroy work, bypass the Git hooks or show a secret, and are on
# without their key too. Those in Git hooks check every commit or push, yours or Claude's.
# conventional-commits also takes its settings instead of true, such as
# { types: [feat, fix], max-length: 72 }; types: any takes any type, max-length: 0 any length.
checks:
  no-git-hook-bypass: true
  no-destructive-commands: true
  no-secrets-in-context: true
  no-ai-coauthor: true
  conventional-commits: true
  no-secrets-in-commits: true
  no-stale-adr-date: true
  linear-history: true
