# Tools and tasks for working on this repo; CI runs the same `mise run check`. Python is the oldest
# the plugin supports (ADR binary), so the tests catch code that needs a newer one.
[tools]
python = "3.9.25"
shellcheck = "0.11.0"
ruff = "0.17.0"
node = "24.21.0"
"npm:cspell" = "10.3.6"

[tasks.check]
description = "Test and lint the Python code, lint the Hooks' sh, and spell-check the repo"
run = [
  "python -m unittest discover -s tests -t .",
  "ruff check plugins/baloo/scripts src tests",
  "shellcheck plugins/baloo/scripts/hook",
  "cspell --no-progress $(git ls-files -co --exclude-standard)",
]

# The tag and main, one commit past it with the README pinned to it, are pushed together: with
# nothing to build, a copy that updates to the new version before the Release workflow has run
# misses only its notes page (ADR releases).
[tasks.release]
description = "Make a Release from the commits since the last one and push it with main"
run = '''
python src/release/release.py
git push --atomic origin main "$(git describe --tags --abbrev=0 --match 'v*')"
'''
